[project]
name = "omp-hermes-bridge"
version = "0.0.0"
description = "Connect running omp sessions and Hermes Agent: events out, prompts and answers in."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/haesol-shin/omp-hermes-bridge"
Changelog = "https://github.com/haesol-shin/omp-hermes-bridge/blob/main/CHANGELOG.md"
Issues = "https://github.com/haesol-shin/omp-hermes-bridge/issues"

[dependency-groups]
dev = ["jsonschema>=4.23", "rfc3339-validator>=0.1.4", "pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.pytest.ini_options]
testpaths = ["tests"]
